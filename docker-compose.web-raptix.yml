# Web stack (W16 cutover). The UI and API run here together with their own
# PostgreSQL, Neo4j, Skillogy and LiteLLM. Each stack owns one set of infra, so the
# web stack's data, graph and LLM proxy never reach the lab stack's, and the reverse.
# The services below reuse the base definitions from docker-compose.yml; only the
# container name, network, volumes and published ports are changed here.
name: raptix-web-raptix

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    container_name: raptix${RAPTIX_STACK_NAME:+-${RAPTIX_STACK_NAME}}-web-postgres
    networks: !override [raptix-net]
    ports: !reset []
    volumes: !override
      - web_postgres_data:/var/lib/postgresql/data

  neo4j:
    extends:
      file: docker-compose.yml
      service: neo4j
    container_name: raptix${RAPTIX_STACK_NAME:+-${RAPTIX_STACK_NAME}}-web-neo4j
    networks: !override [raptix-net]
    ports: !reset []
    volumes: !override
      - web_neo4j_data:/data
      - web_neo4j_logs:/logs

  skillogy:
    extends:
      file: docker-compose.yml
      service: skillogy
    container_name: raptix${RAPTIX_STACK_NAME:+-${RAPTIX_STACK_NAME}}-web-skillogy
    networks: !override [raptix-net]
    ports: !reset []

  litellm:
    extends:
      file: docker-compose.yml
      service: litellm
    container_name: raptix${RAPTIX_STACK_NAME:+-${RAPTIX_STACK_NAME}}-web-litellm
    networks: !override [raptix-net]
    ports: !reset []

  web-raptix-api:
    image: ghcr.io/akapi895/raptix-web-raptix-api:${RAPTIX_VERSION:-stable}
    build:
      context: .
      dockerfile: infra/containers/web-raptix-server.Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0}
        SOURCE_REVISION: ${RAPTIX_REPO_HEAD:-unknown}
    container_name: raptix${RAPTIX_STACK_NAME:+-${RAPTIX_STACK_NAME}}-web-raptix-api
    env_file: .env
    environment:
      - PORT=8081
      - HOST=0.0.0.0
      # The web stack's own database on its own postgres (migrations are its own).
      - DATABASE_URL=postgresql://raptix:${POSTGRES_PASSWORD:-raptix}@postgres:5432/raptix_web_raptix
      - RAPTIX_RUNTIME_WORKSPACE_ROOT=/workspace
      - LANGGRAPH_API_URL=http://langgraph:2024
      - NEO4J_HTTP_URI=http://neo4j:7474
      - NEO4J_USER=neo4j
      - RAPTIX_CONSOLE_DATA_DIR=/console-data
      # ADR-0086 A: creating a project starts its own sandbox (sbx-<slug>) through the host sandbox controller.
      - RAPTIX_SANDBOX_PER_PROJECT=1
      - RAPTIX_SANDBOX_CONTROLLER_URL=http://host.docker.internal:9200
      - RAPTIX_SANDBOX_CONTROLLER_TOKEN_FILE=/run/secrets/sandbox-controller-token
      - RAPTIX_SANDBOX_KEY_FILE=/run/secrets/sandbox-key
      # The LangGraph API requires this token of every caller; the web API presents it on each runtime call.
      - RAPTIX_RUNTIME_API_TOKEN_FILE=/run/secrets/runtime-api-token
    volumes:
      # Generated, read-only console data (knowledge index, capability catalog); never copied into the image.
      - ./data:/console-data:ro
      # Secrets for the sandbox controller and token derivation. Mounted only here, never into a sandbox or the runtime.
      - ${RAPTIX_SANDBOX_SECRETS_DIR:?set RAPTIX_SANDBOX_SECRETS_DIR in .env}/controller-token:/run/secrets/sandbox-controller-token:ro
      - ${RAPTIX_SANDBOX_SECRETS_DIR:?set RAPTIX_SANDBOX_SECRETS_DIR in .env}/sandbox-key:/run/secrets/sandbox-key:ro
      - ${RAPTIX_SANDBOX_SECRETS_DIR:?set RAPTIX_SANDBOX_SECRETS_DIR in .env}/runtime-api-token:/run/secrets/runtime-api-token:ro
    # The API reaches the host sandbox controller (loopback on the host) through this name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081/api/health', r => { r.resume(); process.exit(r.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    # ADR-0102: the API reads and writes project files through each project's sandbox, so it joins the sandbox network.
    networks:
      - raptix-net
      - sandbox-net
    restart: unless-stopped

  web-raptix-ui:
    image: ghcr.io/akapi895/raptix-web-raptix-ui:${RAPTIX_VERSION:-stable}
    build:
      context: .
      dockerfile: infra/containers/web-raptix.Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0}
        SOURCE_REVISION: ${RAPTIX_REPO_HEAD:-unknown}
    container_name: raptix${RAPTIX_STACK_NAME:+-${RAPTIX_STACK_NAME}}-web-raptix-ui
    # Cutover binds the SAME host port the legacy web served (3000), so the
    # CLI `/web` command and launcher health checks keep working unchanged.
    ports:
      - "127.0.0.1:${WEB_RAPTIX_PORT:-3000}:8080"
    depends_on:
      web-raptix-api:
        condition: service_healthy
    networks:
      - raptix-net
    restart: unless-stopped

volumes:
  web_postgres_data:
    name: raptix_web_postgres_data
  web_neo4j_data:
    name: raptix_web_neo4j_data
  web_neo4j_logs:
    name: raptix_web_neo4j_logs

networks:
  raptix-net:
    name: ${RAPTIX_NETWORK:-raptix_web_raptix-net}
  sandbox-net:
    name: ${RAPTIX_SANDBOX_NETWORK:-raptix_web_sandbox-net}
