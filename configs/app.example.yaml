# Example config. Copy to configs/app.yaml or override fields via RAP_* env vars.
server:
  addr: ":8080"
  shutdown_timeout: 10s

database:
  url: "postgres://raptix:raptix@localhost:5432/raptix?sslmode=disable"
  max_conns: 10
  connect_timeout: 5s
  migration_lock_timeout: 15s

artifact:
  root: "./data/artifacts"

content:
  # These paths are relative to the process CWD. Run the server from backend/.
  root: "../content"
  schema_root: "../contracts/manifests"

llm:
  base_url: "https://stream-netmind.viettel.vn/aigw/ai/v1"
  model: "MiniMax/MiniMax-M3-VIP"
  # api_key: set via RAP_LLM_API_KEY (or configs/app.yaml, which is git-ignored)
  timeout: 60s

log:
  level: "info"
