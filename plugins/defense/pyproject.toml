[project]
name = "raptix-defense"
version = "0.0.0"
description = "Defense domain pack: CONOPS workspace resolution (the SIEM/EDR detection pushers POST over HTTP and stay in the raptix runtime — plugin packs import stdlib + SDK/core only)."
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_defense"]
