[project]
name = "raptix-defense"
version = "0.0.0"
description = "Defense domain pack: CONOPS resolution + SIEM/EDR detection builders (the blue_cell runtime loop stays in the raptix package)."
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_defense"]
