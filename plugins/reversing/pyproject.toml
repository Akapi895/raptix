[project]
name = "raptix-reversing"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[project.entry-points."raptix.subagents"]
reverser = "raptix_reversing.agent:SUBAGENT_SPEC"
[project.entry-points."raptix.prompt_resources"]
reversing = "raptix_reversing.agent:PROMPTS"
[project.entry-points."raptix.domains"]
reversing = "raptix_reversing:DOMAIN_PACK"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_reversing"]
