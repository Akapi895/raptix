[project]
name = "raptix-web"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[project.entry-points."raptix.domains"]
web = "raptix_web:DOMAIN_PACK"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_web"]
