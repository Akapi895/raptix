[project]
name = "raptix-iot"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[project.entry-points."raptix.subagents"]
iot_operator = "raptix_iot.agent:SUBAGENT_SPEC"
[project.entry-points."raptix.prompt_resources"]
iot = "raptix_iot.agent:PROMPTS"
[project.entry-points."raptix.domains"]
iot = "raptix_iot:DOMAIN_PACK"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_iot"]
