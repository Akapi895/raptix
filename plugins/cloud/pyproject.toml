[project]
name = "raptix-cloud"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[project.entry-points."raptix.subagents"]
cloud_hunter = "raptix_cloud.agent:SUBAGENT_SPEC"
[project.entry-points."raptix.prompt_resources"]
cloud = "raptix_cloud.agent:PROMPTS"
[project.entry-points."raptix.domains"]
cloud = "raptix_cloud:DOMAIN_PACK"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_cloud"]
