[project]
name = "raptix-contracts"
version = "0.0.0"
description = "Offline Solidity analysis and Foundry harness plugin for Raptix"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]

[project.entry-points."raptix.bundles"]
contracts = "raptix_contracts.tools:get_bundle"

[project.entry-points."raptix.subagents"]
contract_auditor = "raptix_contracts.agent:SUBAGENT_SPEC"

[project.entry-points."raptix.prompt_resources"]
contracts = "raptix_contracts.agent:PROMPTS"

[project.entry-points."raptix.domains"]
contracts = "raptix_contracts:DOMAIN_PACK"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raptix_contracts"]
