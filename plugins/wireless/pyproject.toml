[project]
name = "raptix-wireless"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[project.entry-points."raptix.subagents"]
wireless_operator = "raptix_wireless.agent:SUBAGENT_SPEC"
[project.entry-points."raptix.prompt_resources"]
wireless = "raptix_wireless.agent:PROMPTS"
[project.entry-points."raptix.domains"]
wireless = "raptix_wireless:DOMAIN_PACK"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_wireless"]
