[project]
name = "raptix-active-directory"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[project.entry-points."raptix.subagents"]
ad_operator = "raptix_active_directory.agent:SUBAGENT_SPEC"
[project.entry-points."raptix.prompt_resources"]
active-directory = "raptix_active_directory.agent:PROMPTS"
[project.entry-points."raptix.domains"]
active-directory = "raptix_active_directory:DOMAIN_PACK"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_active_directory"]
