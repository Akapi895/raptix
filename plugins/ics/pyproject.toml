[project]
name = "raptix-ics"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[project.entry-points."raptix.subagents"]
ics_operator = "raptix_ics.agent:SUBAGENT_SPEC"
[project.entry-points."raptix.prompt_resources"]
ics = "raptix_ics.agent:PROMPTS"
[project.entry-points."raptix.domains"]
ics = "raptix_ics:DOMAIN_PACK"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_ics"]
