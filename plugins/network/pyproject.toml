[project]
name = "raptix-network"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[project.entry-points."raptix.domains"]
network = "raptix_network:DOMAIN_PACK"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_network"]
