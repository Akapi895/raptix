[project]
name = "raptix-mobile"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["raptix-sdk"]
[project.entry-points."raptix.subagents"]
mobile_operator = "raptix_mobile.agent:SUBAGENT_SPEC"
[project.entry-points."raptix.prompt_resources"]
mobile = "raptix_mobile.agent:PROMPTS"
[project.entry-points."raptix.domains"]
mobile = "raptix_mobile:DOMAIN_PACK"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["raptix_mobile"]
