[project]
name = "raptix-example-middleware"
version = "0.0.1"
description = "Decepticon plugin scaffolded by raptix-sdk."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"

dependencies = [
    "raptix-sdk",
]

[project.entry-points."raptix.middleware"]
raptix_example_middleware = "raptix_example_middleware"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raptix_example_middleware"]
