# docker-compose.watch.yml — hot-reload overrides for development
#
# Requires Docker Compose 2.22+ (introduces the `develop.watch` key).
# Kept separate from docker-compose.yml so OSS users on older Compose
# versions don't hit "Additional property develop is not allowed".
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.watch.yml watch
#   # or via make:
#   make dev
services:
  langgraph:
    develop:
      watch:
        - action: sync
          # Phase 0 of the core/framework/sdk split relocated the source
          # tree to packages/raptix/raptix/. The Dockerfile
          # COPY now pulls packages/, and uv sync installs editable from
          # there — hot-reload mirrors the same path inside the image.
          # Skills live under packages/raptix/raptix/skills,
          # so this sync covers them too — no dedicated entry needed.
          path: ./packages/raptix/raptix
          target: /app/packages/raptix/raptix
        - action: sync
          # raptix-core changes also live-sync into the editable
          # install so plugin registry / role registry tweaks land
          # without a full image rebuild.
          path: ./packages/raptix-core/raptix_core
          target: /app/packages/raptix-core/raptix_core
        - action: sync
          path: ./langgraph.json
          target: /app/langgraph.json
        - action: rebuild
          # Any workspace pyproject change forces a rebuild — uv sync
          # must re-resolve the dependency closure.
          path: ./pyproject.toml
        - action: rebuild
          path: ./packages/raptix/pyproject.toml
        - action: rebuild
          path: ./packages/raptix-core/pyproject.toml
        - action: rebuild
          path: ./infra/containers/langgraph.Dockerfile

  # web service: retired with W20 — the web-raptix stack has its own
  # Vite dev server (make webraptix-dev) outside compose watch.

  cli:
    develop:
      watch:
        - action: sync
          path: ./apps/cli/src
          target: /app/src
        - action: rebuild
          path: ./apps/cli/package.json
        - action: rebuild
          path: ./infra/containers/cli.Dockerfile
