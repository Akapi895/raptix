name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Keep CI OK visible on docs-only changes by filtering jobs.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.app.outputs.python }}
      cli: ${{ steps.app.outputs.cli }}
      desktop: ${{ steps.app.outputs.desktop }}
      launcher: ${{ steps.app.outputs.launcher }}
      compose: ${{ steps.app.outputs.compose }}
      web: ${{ steps.app.outputs.web }}
      docker-images: ${{ steps.docker.outputs.changes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: app
        with:
          filters: |
            python:
              - 'packages/raptix/**'
              - 'packages/raptix-core/**'
              - 'packages/raptix-sdk/**'
              - 'packages/raptix-skills/**'
              - 'plugins/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            cli:
              - 'apps/cli/**'
              - 'apps/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            desktop:
              - 'apps/desktop/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            launcher:
              - 'apps/launcher/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/api/**'
              - 'apps/ui-app/**'
              - 'apps/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
      # Filter names map to Dockerfile names in the build matrix.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: docker
        with:
          filters: |
            langgraph:
              - 'infra/containers/langgraph.Dockerfile'
              - 'packages/**'
              - 'plugins/**'
              - 'langgraph.json'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'README.md'
              - '.github/workflows/ci.yml'
            api:
              - 'infra/containers/api.Dockerfile'
              - 'apps/api/**'
              - 'apps/shared/**'
              - 'packages/raptix-skills/raptix_skills/defs/**'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            ui-app:
              - 'infra/containers/ui-app.Dockerfile'
              - 'infra/containers/ui-app.nginx.conf'
              - 'apps/ui-app/**'
              - 'apps/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            litellm:
              - 'infra/containers/litellm.Dockerfile'
              - 'infra/config/litellm.yaml'
              - '.github/workflows/ci.yml'
            sandbox:
              - 'infra/containers/sandbox.Dockerfile'
              - '.github/workflows/ci.yml'
            cli:
              - 'infra/containers/cli.Dockerfile'
              - 'apps/cli/**'
              - 'apps/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            c2-sliver:
              - 'infra/containers/c2-sliver.Dockerfile'
              - '.github/workflows/ci.yml'

  compose-validate:
    name: Compose YAML validate
    needs: changes
    if: ${{ needs.changes.outputs.compose == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Compose needs a local .env to render the service definitions.
      - name: Create empty .env for Compose validation
        run: touch .env
      - name: Validate base docker-compose.yml
        run: docker compose -f docker-compose.yml config > /dev/null
      - name: Validate base + dev override
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null
      - name: Validate base + dev + watch
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.watch.yml config > /dev/null

  python:
    name: Python (lint + typecheck + test)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.15"
          enable-cache: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Cache .venv
        id: venv-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock', 'pyproject.toml') }}
      - run: uv sync --dev --locked
      - name: Lint and typecheck
        run: make ci-lint
      - name: Upload basedpyright JSON (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: basedpyright-${{ github.run_id }}
          path: bp.json
          retention-days: 7
      - name: Skill corpus audit (strict mode)
        run: make audit-skills-strict
      - name: Capability contracts and held-out scorecards
        run: uv run pytest -q packages/raptix/tests/unit/capabilities
      - name: Cache the MITRE STIX bundle
        run: make bootstrap-skill-graph
      - name: Verify the checked-in skill graph
        run: |
          set +e
          make check-skill-graph
          ec=$?
          if [ $ec -ne 0 ]; then
            echo "::group::Diff against checked-in dump"
            uv run python -m raptix.skills.engine.builder --frozen-built-at --out /tmp/built.cypher
            diff -u packages/raptix/raptix/skills/.graph/skills.cypher /tmp/built.cypher | head -200 || true
            echo "::endgroup::"
            exit $ec
          fi
      - name: Pytest without coverage
        if: github.event_name != 'push'
        run: make ci-test
      - name: Pytest with coverage
        if: github.event_name == 'push'
        run: make ci-test-coverage
      - name: Upload coverage artifact
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  coverage-report:
    name: PR coverage report (informational)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # diff-cover needs the merge base.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.15"
          enable-cache: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Cache .venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock', 'pyproject.toml') }}
      - run: uv sync --dev --locked
      - name: Collect coverage without a threshold
        run: make ci-test-coverage-report
      - name: Coverage on changed lines
        if: always()
        env:
          PR_BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ -f coverage.xml ]; then
            git fetch origin "$PR_BASE_BRANCH" --depth=1 || true
            {
              echo ""
              echo "## Patch coverage (changed lines)"
              echo ""
              uv tool run diff-cover coverage.xml \
                --compare-branch "origin/$PR_BASE_BRANCH" \
                --markdown-report diff-cover.md --quiet \
                && cat diff-cover.md || echo "_diff-cover failed — see logs._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Write coverage summary to step summary
        if: always()
        run: |
          {
            echo "## Coverage report (informational)"
            echo ""
            if [ -f coverage.xml ]; then
              rate=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('coverage.xml').getroot().attrib.get('line-rate','0'))")
              pct=$(python -c "print(f'{float(\"$rate\")*100:.2f}')")
              echo "**Line coverage:** ${pct}%"
            else
              echo "_coverage.xml not produced — see the pytest step logs._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-pr
          path: coverage.xml
          if-no-files-found: ignore

  cli:
    name: CLI (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - if: needs.changes.outputs.cli != 'true'
        run: 'echo "No CLI-relevant changes — emitting success."'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: needs.changes.outputs.cli == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: needs.changes.outputs.cli == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - if: needs.changes.outputs.cli == 'true'
        run: npm ci
      # npm ci can omit Rollup binaries for platforms outside the lockfile.
      - name: Repair rollup native binary on non-Linux runners
        if: needs.changes.outputs.cli == 'true' && runner.os != 'Linux'
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            macOS-ARM64) npm install --no-save @rollup/rollup-darwin-arm64 ;;
            macOS-X64)   npm install --no-save @rollup/rollup-darwin-x64 ;;
            Windows-X64) npm install --no-save @rollup/rollup-win32-x64-msvc ;;
          esac
      - name: Build shared streaming workspace
        if: needs.changes.outputs.cli == 'true'
        run: npm run build --workspace=@raptix/streaming
      - if: needs.changes.outputs.cli == 'true'
        run: cd apps/cli && npm run typecheck
      - name: Run CLI tests
        if: needs.changes.outputs.cli == 'true'
        run: cd apps/cli && npm test --if-present

  web:
    name: Web (apps/api + apps/ui-app)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - if: needs.changes.outputs.web != 'true'
        run: 'echo "No apps/api or apps/ui-app changes — emitting success."'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: needs.changes.outputs.web == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - if: needs.changes.outputs.web == 'true'
        run: npm ci
      - name: Generate the Prisma client
        if: needs.changes.outputs.web == 'true'
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - name: Build shared Web contracts
        if: needs.changes.outputs.web == 'true'
        run: |
          npm run build --workspace=@raptix/streaming
          npm run build --workspace=@raptix/web-contracts
      - name: apps/api typecheck + lint + build + test
        if: needs.changes.outputs.web == 'true'
        run: |
          npm run typecheck --workspace=@raptix/api
          npm run lint --workspace=@raptix/api
          npm run build --workspace=@raptix/api
          npm run test --workspace=@raptix/api
      - name: Install Chromium for apps/ui-app's browser-driven unit tests
        if: needs.changes.outputs.web == 'true'
        run: npx playwright install --with-deps chromium
      - name: apps/ui-app typecheck + build + test
        if: needs.changes.outputs.web == 'true'
        run: |
          npm run build --workspace=@raptix/ui-app
          cd apps/ui-app && npx vitest run

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - if: needs.changes.outputs.desktop != 'true'
        run: 'echo "No Desktop-relevant changes — emitting success."'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: needs.changes.outputs.desktop == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: needs.changes.outputs.desktop == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - if: needs.changes.outputs.desktop == 'true'
        run: npm ci
      - name: Syntax-check desktop sources
        if: needs.changes.outputs.desktop == 'true'
        run: |
          node --check apps/desktop/src/config.mjs
          node --check apps/desktop/src/platform.mjs
          node --check apps/desktop/src/ui.mjs
          node --check apps/desktop/src/main.mjs
          node --check apps/desktop/src/preload.cjs
      - name: Run desktop unit tests
        if: needs.changes.outputs.desktop == 'true'
        run: npm run desktop:test

  launcher:
    name: Launcher (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - if: needs.changes.outputs.launcher != 'true'
        run: 'echo "No Launcher-relevant changes — emitting success."'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: needs.changes.outputs.launcher == 'true'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: needs.changes.outputs.launcher == 'true'
        with:
          go-version-file: apps/launcher/go.mod
          cache-dependency-path: apps/launcher/go.sum
      - name: go vet
        if: needs.changes.outputs.launcher == 'true'
        working-directory: apps/launcher
        run: go vet ./...
      - name: go test
        if: needs.changes.outputs.launcher == 'true'
        working-directory: apps/launcher
        run: go test ./...

  docker-build:
    name: Docker build (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.docker-images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.docker-images) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: infra/containers/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: raptix-${{ matrix.image }}:ci
          build-args: |
            RAPTIX_REPO_HEAD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=${{ github.event_name == 'push' && 'max' || 'min' }}
      # Scan findings are recorded in SARIF for review.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: raptix-${{ matrix.image }}:ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif
          if-no-files-found: ignore

  docker-build-arm64:
    name: Docker arm64 smoke (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.docker-images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [cli, langgraph]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build linux/arm64 image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: infra/containers/${{ matrix.image }}.Dockerfile
          push: false
          load: false # Keep the cross-built image in the Buildx cache.
          platforms: linux/arm64
          tags: raptix-${{ matrix.image }}:ci-arm64
          build-args: |
            RAPTIX_REPO_HEAD=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=${{ github.event_name == 'push' && 'max' || 'min' }},scope=arm64

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: uv tool install pip-audit
      - name: Export requirements
        run: uv export --locked --format requirements-txt --no-hashes --no-dev > requirements.txt
      - name: Run pip-audit (blocking)
        run: |
          ignore_args=()
          if [ -f .pip-audit-ignore ]; then
            while IFS= read -r vid; do
              vid="${vid%%#*}"; vid="$(echo "$vid" | xargs)"
              [ -n "$vid" ] && ignore_args+=(--ignore-vuln "$vid")
            done < .pip-audit-ignore
          fi
          uv tool run pip-audit --requirement requirements.txt "${ignore_args[@]}"

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # Advisory coverage is excluded from the required check.
  ci-ok:
    name: CI OK (required status)
    if: always()
    needs:
      - changes
      - compose-validate
      - python
      - cli
      - web
      - desktop
      - launcher
      - docker-build
      - docker-build-arm64
      - security
      - actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no needed job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length')
          if [ "$bad" != "0" ]; then
            echo "::error::$bad required job(s) failed or were cancelled."
            exit 1
          fi
