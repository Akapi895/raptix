name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (vet+build+test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: raptix
          POSTGRES_PASSWORD: raptix
          POSTGRES_DB: raptix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raptix -d raptix_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RAP_TEST_DATABASE_URL: postgres://raptix:raptix@localhost:5432/raptix_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -mod=readonly -count=1 ./...

  compose:
    name: Compose config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f deploy/compose.yaml config --quiet
