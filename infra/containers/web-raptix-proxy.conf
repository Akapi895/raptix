# Same-origin proxy for the new web-raptix stack (guide §14.3):
#   /projects/*  → SPA fallback to index.html
#   /assets/*    → immutable hashed assets
#   /api/*       → new web-raptix-server upstream, SSE buffering off
# API responses must never fall back to SPA HTML.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived hashed build output.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Same-origin API/SSE. `proxy_buffering off` keeps event streams flowing;
    # long read timeouts survive idle SSE heartbeats; disconnects never cancel
    # a runtime run (the server owns run lifetime).
    location /api/ {
        proxy_pass http://web-raptix-api:8081;
        proxy_http_version 1.1;
        # W03: forward the client's original Host authority INCLUDING the
        # external port. `$host` strips the port, so a browser Origin
        # http://127.0.0.1:3001 no longer matched the forwarded Host and the
        # API's same-origin check refused login/mutations with 403.
        # X-Forwarded-Host/Proto are recorded for upstream observability only;
        # the API never trusts client-supplied X-Forwarded-* on its own.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    # HTML shell: no-store so a deploy never leaves a stale shell behind.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback for client-side routes (/projects/*, workspace pages).
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
