apiVersion: manifest/v1
kind: tool
name: nmap
version: 1.0.0
description: "Network mapping and port scanning. Default behavior: TCP connect scan (-sT), version detection (-sV) and default NSE scripts (-sC). Optional timing templates, custom NSE scripts and OS detection (requires root). Use only against targets you own or are authorized to test."
license: Apache-2.0
executor:
  type: command
  command: nmap
  args:
    - -sT
    - -sV
    - -sC
runtime:
  container: true
  network: true
  resources:
    cpu: 1
    memory: 512Mi
input:
  type: object
  properties:
    target:
      type: string
      description: IP, hostname, CIDR, or domain; URL host is extracted automatically.
    ports:
      type: string
      description: Port range, e.g. 80, 1-1000, or 80,443,8080.
    timing:
      type: string
      description: Timing template T0-T5; e.g. 4 produces -T4.
    nse_scripts:
      type: string
      description: NSE scripts passed to --script, e.g. vuln or http-title,http-headers.
    os_detection:
      type: boolean
      description: Enable -O OS detection. Requires root.
    aggressive:
      type: boolean
      description: Enable -A aggressive scan including OS detection. Requires root.
    scan_type:
      type: string
      description: Replaces the default -sT -sV -sC; e.g. -sT -sV or -sU.
    additional_args:
      type: string
      description: Extra arguments appended to the command line.
  required:
    - target
output:
  type: object
  description: Raw nmap output; parsed structure is defined by the registry parser version.
source:
  repo: CyberStrikeAI
  path: tools/nmap.yaml
  commit: f44adaddf399244f701bfefc6767f164fb3eec2c
