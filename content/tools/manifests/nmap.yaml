apiVersion: manifest/v1
kind: tool
name: nmap
version: 1.0.0
description: "Network mapping and port scanning via the sandboxed nmap command. Phase 4 supports a validated subset of arguments: a target, an optional port list, and flags drawn from a per-tool allowlist. Use only against targets you own or are authorized to test."
license: Apache-2.0
executor:
  type: command
  command: nmap
  args:
    - -sT
    - -sV
runtime:
  container: true
  network: true
  resources:
    cpu: 1
    memory: 512Mi
input:
  type: object
  properties:
    target:
      type: string
      description: IP, hostname, CIDR, or domain. Must not start with '-' or contain whitespace.
    ports:
      type: string
      description: Port list or range, e.g. 80, 1-1000, or 80,443,8080.
    flags:
      type: array
      items:
        type: string
      description: Additional flags, each restricted to the capability allowlist (e.g. -sV, -Pn, -T4).
  required:
    - target
output:
  type: object
  description: Raw nmap stdout recorded as a raw artifact; parsed structure is defined by a later parser version.
source:
  repo: CyberStrikeAI
  path: tools/nmap.yaml
  commit: f44adaddf399244f701bfefc6767f164fb3eec2c
