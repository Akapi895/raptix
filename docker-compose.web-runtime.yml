# Dedicated, single-engagement Web execution plane. Layer onto web-raptix.yml.
# CLI runtime/sandbox and their mounts are not recreated by this profile.
services:
  web-raptix-api:
    environment:
      LANGGRAPH_API_URL: http://web-runtime:2024
      RAPTIX_RUNTIME_WORKSPACE_ROOT: /workspace
      RAPTIX_RUNTIME_SANDBOX_URL: http://web-sandbox:9999
      # ADR-0086 A: each project runs in its own sandbox (sbx-<slug>); the shared web-sandbox is no longer routed to.
      RAPTIX_SANDBOX_PER_PROJECT: '1'
    volumes:
      - web_runtime_workspace:/workspace
    depends_on:
      web-runtime:
        condition: service_healthy

  web-runtime:
    image: ghcr.io/akapi895/raptix-langgraph:${WEB_RUNTIME_IMAGE_TAG:-web-m1}
    # Same local dev-server compatibility as the base runtime; strict async stays opt-in.
    command:
      - sh
      - -c
      - >
        if [ -z "$${LANGGRAPH_STRICT_ASYNC:-}" ]; then
          exec langgraph dev --host 0.0.0.0 --port 2024 --no-browser --n-jobs-per-worker 10 --allow-blocking;
        else
          exec langgraph dev --host 0.0.0.0 --port 2024 --no-browser --n-jobs-per-worker 10;
        fi
    build:
      context: .
      dockerfile: infra/containers/langgraph.Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0}
        RAPTIX_REPO_HEAD: ${RAPTIX_REPO_HEAD:-}
    env_file: .env
    environment:
      # Not pinned to one engagement: each run's workspace comes from its project (configurable.workspace_path).
      # Overrides the same keys from env_file, which would otherwise pin the benchmark engagement.
      RAPTIX_ENGAGEMENT: ''
      RAPTIX_ENGAGEMENT_WORKSPACE: ''
      RAPTIX_LLM__PROXY_URL: http://litellm:4000
      RAPTIX_LLM__PROXY_API_KEY: ${LITELLM_MASTER_KEY:-sk-raptix-master}
      RAPTIX_NEO4J_URI: bolt://neo4j:7687
      RAPTIX_NEO4J_USER: neo4j
      RAPTIX_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-raptix-graph}
      SANDBOX_URL: http://web-sandbox:9999
      RAPTIX_HITL__ENABLED: '1'
      RAPTIX_HITL__REQUIRE_BASH_APPROVAL: '1'
      RAPTIX_USE_SKILLOGY: ${RAPTIX_USE_SKILLOGY:-1}
      RAPTIX_SKILLOGY_URL: http://skillogy:9100
    volumes:
      - web_runtime_workspace:/workspace
      - web_runtime_state:/app/.langgraph_api
      - ${CLAUDE_CREDENTIALS_VOLUME:-/dev/null}:/root/.claude/.credentials.json:ro
      - ${CODEX_AUTH_VOLUME:-/dev/null}:/root/.codex/auth.json:ro
    networks: [raptix-net, sandbox-net]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    pids_limit: 2048
    init: true
    depends_on:
      web-sandbox:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:2024/ok')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  web-sandbox:
    image: ghcr.io/akapi895/raptix-sandbox:${RAPTIX_VERSION:-stable}
    env_file: .env
    environment:
      SANDBOX_DAEMON: '1'
      # Not pinned to one engagement: each run's workspace comes from its project (configurable.workspace_path).
      # Overrides the same keys from env_file, which would otherwise pin the benchmark engagement.
      RAPTIX_ENGAGEMENT: ''
      RAPTIX_ENGAGEMENT_WORKSPACE: ''
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-raptix-graph}
    volumes:
      - web_runtime_workspace:/workspace
    networks: [sandbox-net]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN, NET_BIND_SERVICE, SYS_PTRACE, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    pids_limit: 4096
    init: true
    restart: unless-stopped

volumes:
  web_runtime_workspace:
  web_runtime_state:

networks:
  sandbox-net:
    external: true
    name: ${RAPTIX_SANDBOX_NETWORK:-raptix${RAPTIX_STACK_NAME:+-${RAPTIX_STACK_NAME}}_sandbox-net}
